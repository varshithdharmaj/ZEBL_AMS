name: Deploy HRMS to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, hrms-production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy HRMS
        run: |
          set -e

          echo "=== GitHub commit being deployed ==="
          git log -1 --oneline

          echo "=== Copying application source ==="
          rsync -a \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='/storage/' \
            --exclude='db-backup/' \
            "$GITHUB_WORKSPACE/" /var/www/hrms/

          cd /var/www/hrms

          echo "=== Installing dependencies ==="
          npm ci

          echo "=== Building HRMS ==="
          npm run build

          echo "=== Restarting HRMS ==="
          pm2 restart hrms

          echo "=== Checking HRMS ==="
          pm2 status hrms

          echo "=== Deployment completed ==="
