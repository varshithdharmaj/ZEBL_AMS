name: Deploy HRMS to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, hrms-production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy HRMS
        run: |
          set -e

          cd /var/www/hrms

          echo "=== Current production commit ==="
          git log -1 --oneline

          echo "=== Updating tracked files ==="
          git reset --hard "$GITHUB_SHA"

          echo "=== Installing dependencies ==="
          npm ci

          echo "=== Building HRMS ==="
          npm run build

          echo "=== Restarting HRMS ==="
          pm2 restart hrms

          echo "=== Checking HRMS ==="
          pm2 status hrms

          echo "=== Deployment completed ==="
